server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 보안 헤더 (add_header는 location에 재선언하지 않으면 상속되지 않으므로
    # 아래 각 location 블록에서도 동일하게 반복 선언함)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.openai.com https://api.x.ai https://openrouter.ai https://api.moonshot.ai https://api.moonshot.cn; frame-src 'none'; object-src 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 정적 에셋 장기 캐싱
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.openai.com https://api.x.ai https://openrouter.ai https://api.moonshot.ai https://api.moonshot.cn; frame-src 'none'; object-src 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA 라우팅
    # /admin, /settings 직접 접근 시 index.html로 fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
